
# =========================
# Basic Broker Configuration
# =========================

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# =========================
# TLS Listener Configuration
# =========================

listener 8883
allow_anonymous false
# Use your Intermediate CA certificate as the trusted CA
# cafile /mosquitto/certs/ca-chain-correct.cert.pem
cafile /mosquitto/certs/ca-chain.cert.pem

# Broker's own certificate and private key
certfile /mosquitto/certs/broker-cert.crt
keyfile /mosquitto/certs/broker-cert.key.pem

# Require client certificates signed by the intermediate CA
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# =========================
# Dynamic Security Plugin for RBAC
# =========================

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json